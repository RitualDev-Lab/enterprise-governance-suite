{{- if .Values.agentshield.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ritual-governance.fullname" . }}-agentshield
  labels:
    app.kubernetes.io/name: agentshield
    app.kubernetes.io/component: control-plane
    {{- include "ritual-governance.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agentshield.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentshield
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentshield
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: agentshield
          image: "{{ .Values.agentshield.image.repository }}:{{ .Values.agentshield.image.tag }}"
          imagePullPolicy: {{ .Values.agentshield.image.pullPolicy }}
          command: ["/nodejs/bin/node", "dist/cli.js"]
          args: ["server", "--port", "{{ .Values.agentshield.port }}"]
          ports:
            - name: fleet-api
              containerPort: {{ .Values.agentshield.port }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: AGENTSHIELD_AIR_GAPPED
              value: {{ .Values.global.airGapped | quote }}
            - name: AGENTSHIELD_ORG_ID
              value: {{ .Values.agentshield.organizationId | quote }}
          resources:
            {{- toYaml .Values.agentshield.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ritual-governance.fullname" . }}-agentshield
  labels:
    app.kubernetes.io/name: agentshield
    {{- include "ritual-governance.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.agentshield.port }}
      targetPort: fleet-api
      protocol: TCP
      name: fleet-api
  selector:
    app.kubernetes.io/name: agentshield
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
