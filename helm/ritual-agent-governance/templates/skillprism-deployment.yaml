{{- if .Values.skillprism.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ritual-governance.fullname" . }}-skillprism
  labels:
    app.kubernetes.io/name: skillprism
    app.kubernetes.io/component: token-cache-hub
    {{- include "ritual-governance.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.skillprism.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: skillprism
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillprism
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: skillprism
          image: "{{ .Values.skillprism.image.repository }}:{{ .Values.skillprism.image.tag }}"
          imagePullPolicy: {{ .Values.skillprism.image.pullPolicy }}
          ports:
            - name: hub-api
              containerPort: {{ .Values.skillprism.port }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: {{ .Values.skillprism.port | quote }}
            - name: SKILLPRISM_REDIS_URL
              value: {{ .Values.skillprism.redisUrl | quote }}
            - name: SKILLPRISM_SHARED_CACHE
              value: {{ .Values.skillprism.sharedCache | quote }}
            - name: SKILLPRISM_CACHE_TTL_DAYS
              value: {{ .Values.skillprism.cacheTtlDays | quote }}
          resources:
            {{- toYaml .Values.skillprism.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ritual-governance.fullname" . }}-skillprism
  labels:
    app.kubernetes.io/name: skillprism
    {{- include "ritual-governance.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.skillprism.port }}
      targetPort: hub-api
      protocol: TCP
      name: hub-api
  selector:
    app.kubernetes.io/name: skillprism
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
