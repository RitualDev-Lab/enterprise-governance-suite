apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poly-cloud-api.fullname" . }}
  labels:
    {{- include "poly-cloud-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "poly-cloud-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "poly-cloud-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "poly-cloud-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "poly-cloud-api.fullname" . }}-config
          env:
            # Master Admin Token
            {{- if .Values.config.existingAdminTokenSecret }}
            - name: DEFAULT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingAdminTokenSecret }}
                  key: {{ .Values.config.adminTokenSecretKey | default "admin-token" }}
            {{- else }}
            - name: DEFAULT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "poly-cloud-api.fullname" . }}-secrets
                  key: DEFAULT_ADMIN_TOKEN
            {{- end }}

            # S3 / Cloudflare R2 Credentials
            {{- if .Values.config.s3.existingSecret }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.s3.existingSecret }}
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.s3.existingSecret }}
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            {{- else }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "poly-cloud-api.fullname" . }}-secrets
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "poly-cloud-api.fullname" . }}-secrets
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            {{- end }}

            # Optional Cryptographic Attestation Public Keys
            {{- if not .Values.config.existingAdminTokenSecret }}
            - name: ATTESTATION_TRUSTED_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "poly-cloud-api.fullname" . }}-secrets
                  key: ATTESTATION_TRUSTED_KEYS
                  optional: true
            {{- end }}

          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}

          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "poly-cloud-api.fullname" . }}-data
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
