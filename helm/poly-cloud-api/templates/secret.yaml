{{- if and (not .Values.config.existingAdminTokenSecret) (not .Values.config.s3.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poly-cloud-api.fullname" . }}-secrets
  labels:
    {{- include "poly-cloud-api.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.config.defaultAdminToken }}
  DEFAULT_ADMIN_TOKEN: {{ .Values.config.defaultAdminToken | b64enc | quote }}
  {{- else }}
  DEFAULT_ADMIN_TOKEN: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.s3.accessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.config.s3.accessKeyId | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.s3.secretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.config.s3.secretAccessKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.attestation.trustedKeys }}
  ATTESTATION_TRUSTED_KEYS: {{ .Values.config.attestation.trustedKeys | b64enc | quote }}
  {{- end }}
{{- end }}
