name: CI & Enterprise IaC Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, Typecheck & Control Plane Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm lint

      - name: Run Test Suite
        run: pnpm test

  helm-and-kubeconform:
    name: Helm Lint & Kubeconform Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Lint & Validate All Helm Charts
        run: |
          for chart in helm/agentshield helm/ritual-agent-governance helm/poly-cloud-api; do
            echo "=== Preparing $chart ==="
            if grep -q "^dependencies:" "$chart/Chart.yaml"; then
              helm dependency update "$chart"
            fi
            echo "=== Linting $chart ==="
            helm lint "$chart"
            echo "=== Kubeconform validating $chart ==="
            helm template release-check "$chart" | kubeconform -strict -ignore-missing-schemas -summary
          done

  terraform-validate:
    name: Terraform Validate (AWS, Azure, GCP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate Cloud Terraform Modules
        run: |
          for dir in terraform/aws terraform/azure terraform/gcp; do
            echo "=== Validating $dir ==="
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  cyclonedx-sbom:
    name: CycloneDX SBOM Generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate CycloneDX 1.5 SBOM
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx --yes @cyclonedx/cyclonedx-npm --output-file sbom-cyclonedx.json --spec-version 1.5 --flatten-components
          ls -lh sbom-cyclonedx.json

      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-governance-suite-cyclonedx-sbom
          path: sbom-cyclonedx.json
          retention-days: 30
